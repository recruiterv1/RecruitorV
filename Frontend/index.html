  <body>

    <!-- Branded boot splash: shown instantly, removed once React mounts -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;
        background:radial-gradient(120% 120% at 50% 0%,#1b1033 0%,#0b0f1e 60%);
        transition:opacity .4s ease;}
      #boot-splash.hide{opacity:0;pointer-events:none;}
      #boot-splash .bs-mark{background:#fff;border-radius:16px;padding:14px 20px;
        box-shadow:0 18px 40px -10px rgba(124,58,237,.5);}
      #boot-splash .bs-mark img{display:block;height:54px;width:auto;}
      #boot-splash .bs-tag{font:600 12px/1 system-ui,Arial,sans-serif;color:#8b8fa3;letter-spacing:.18em;text-transform:uppercase;}
      #boot-splash .bs-dots{display:flex;gap:7px;margin-top:4px;}
      #boot-splash .bs-dots i{width:8px;height:8px;border-radius:50%;background:#7c3aed;
        animation:bsb 1s infinite ease-in-out;}
      #boot-splash .bs-dots i:nth-child(2){animation-delay:.15s;}
      #boot-splash .bs-dots i:nth-child(3){animation-delay:.3s;}
      @keyframes bsb{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}
    </style>
    <div id="boot-splash">
      <div class="bs-mark"><img src="/recuiterv-logo.png" alt="Recruiterv" /></div>
      <div class="bs-tag">Hire Smarter · Earn Together</div>
      <div class="bs-dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      window.__hideBootSplash=function(){var s=document.getElementById('boot-splash');
        if(s){s.classList.add('hide');setTimeout(function(){s.remove();},450);}};
      window.addEventListener('load',function(){setTimeout(window.__hideBootSplash,600);});
    </script>

    <div id="root"></div>
